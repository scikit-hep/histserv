name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Pre-build the dashboard UI so hatch_build.py finds dist/ during packaging.
      # uv/hatchling don't know about bun, so we must do this before the Python build.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
          environments: dashboard
          cache: true

      - name: Bundle dashboard UI
        run: pixi run dashboard-bundle

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, check, build]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: latest
          environments: dashboard
          cache: true

      - name: Run ${{ matrix.check }}
        run: pixi run dashboard-$CHECK
        env:
          CHECK: ${{ matrix.check }}
