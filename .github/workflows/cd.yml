name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "34 5 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pre-build the dashboard UI so hatch_build.py finds dist/ during packaging.
      # uv/hatchling don't know about bun, so we must do this before the Python build.
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: latest
          environments: dashboard
          cache: true

      - name: Bundle dashboard UI
        run: pixi run dashboard-bundle

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  publish:
    name: Publish to PyPI
    needs: [dist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/histserv
    permissions:
      id-token: write  # for trusted publishing and attestation signing
      attestations: write  # to store the build provenance attestation
      contents: read  # required by the attestation action

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
